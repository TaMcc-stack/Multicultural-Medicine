spring.application.name=multiethnic-backend
server.port=8080

# ============================================================
# 数据源 —— 默认使用 H2 磁盘持久化数据库（重启后资料保留）
# 如需切换 MySQL，注释掉下面 H2 配置，并启用底部 MySQL 配置
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/multiethnic;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.encoding=UTF-8

# ============================================================
# 登录 / 鉴权
# ============================================================
# 演示账号（应用启动时若库中不存在则自动创建）
# 注意：不要在此写中文 —— .properties 按 ISO-8859-1 读取会乱码，中文默认值在 DemoDataInitializer.java 中
app.auth.demo-username=demo
app.auth.demo-password=123456
# token 有效期（小时），默认 7 天
app.auth.token-expire-hours=168

# 可选登录路径（逗号分隔的 Ant 模式）：这些路径**不强求**登录——
# 带了有效 token 就按登录用户处理，没带或已失效就放行当匿名。
# 与 WebConfig 的 excludePathPatterns 不同：被 exclude 的路径根本不解析 token，
# 连已登录用户也会被当成匿名，所以「匿名可用、登录则更好」的接口要写在这里。
# 目前只有留言板：/api/feedback 的列表与发布允许匿名，
# 而更深的 /api/feedback/{id}/like 等不在模式内，仍然强制登录。
app.auth.optional-paths=/api/feedback

# ============================================================
# 切换 MySQL 时启用（需先创建数据库 multiethnic）
# ============================================================
#spring.datasource.url=jdbc:mysql://localhost:3306/multiethnic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=your_password
#spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:sql/schema.sql

logging.level.com.backend=info

# ============================================================
# 问答引擎（Qwen）
# ------------------------------------------------------------
# 未配置 app.qwen.api-key 时，自动使用模板生成引擎（基于证据拼装），
# 保证 POC 演示链路可用；配置 API Key 后自动切换为 Qwen 大模型生成。
# 填写阿里云百炼 DashScope API Key 即可启用，例如：
#   app.qwen.api-key=sk-xxxxxxxxxxxxxxxx
# ============================================================
app.qwen.api-key=
app.qwen.model=qwen-plus
app.qwen.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1

# ============================================================
# 知识库文件上传
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# 上传文件落盘目录（相对应用启动目录；生产可改为绝对路径或对象存储）
app.kb.storage-dir=kb_data

# 官方账号白名单（逗号分隔的用户 ID）：这些用户上传的资料直接标记为 official 且免审核。
# 目前只有 demo 一个官方账号（id=1，见 DemoDataInitializer）。
# 新增官方账号时在这里追加 ID 即可，不必改代码——用配置而不是硬编码，
# 是因为用户 ID 是自增的，写死在 Java 里换套环境就失效。
app.kb.official-user-ids=1

# 「从链接导入」的域名白名单：域名:显示名，逗号分隔。
# 显示名会成为该文档的「来源机构」；只有这里列出的域名（含子域）才允许抓取。
# 这是服务端请求的唯一放行口——不做白名单就是 SSRF 跳板。
# 注意 SinoMed（sinomed.ac.cn）**不在**这里：它检索需要登录+验证码，抓不了，
# 走前端「粘贴正文」那条路。
app.kb.import-whitelist=people.com.cn:人民网,xinhuanet.com:新华网,news.cn:新华网,nhc.gov.cn:国家卫生健康委,gov.cn:中国政府网,jkb.com.cn:健康报
