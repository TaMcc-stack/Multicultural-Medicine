worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    # 临时目录写到 /tmp：容器里只有 /tmp 是无条件可写的
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile on;

    # 知识库上传上限，对齐 Spring 的 spring.servlet.multipart.max-file-size=50MB
    client_max_body_size 50m;

    upstream spring  { server 127.0.0.1:8080; }
    upstream fastapi { server 127.0.0.1:8000; }

    server {
        listen 7860;
        server_name _;

        root /app/dist;
        index index.html;

        # ---------- 平台健康探测 ----------
        #
        # ★ 没有这一块，整个应用在平台上就是「关闭了连接」★
        #
        # 平台底层跑在阿里云函数计算上，会持续 `POST /invoke` 探测实例。
        # 不特判的话它落进下面的 location /，被当成静态文件请求 ——
        # 静态文件不接受 POST，nginx 回 405，平台据此认定实例未就绪，
        # 于是**一放用户流量都不转发**。表现是浏览器一直显示「关闭了连接」，
        # 而日志里只有 /invoke 的 405、看不到任何真实请求。
        #
        # 返回 200 即可。这纯粹是平台的探活约定，不是业务接口。
        location = /invoke {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # ---------- 前端：SPA 回退 ----------
        # /chat /kb 等前端路由直接刷新时不 404
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------- 业务后端（Spring Boot :8080）----------
        #
        # 必须排在下面的 /api/ 兜底之前：nginx 的 regex location 按出现顺序匹配，
        # 第一个命中的胜出，而 regex 又优先于前缀 location。
        #
        # 路径清单逐条对应 frontend/vite.config.ts 的 server.proxy。
        # 用 (/|$) 收尾，「/api/kb」不会误伤「/api/kbxxx」。
        location ~ ^/api/(auth|conversations|qa|kb|dynamics|favorites|search-history|gaps|feedback|health)(/|$) {
            proxy_pass http://spring;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ★ 关键：摘掉 Origin，否则 POST 全部 403 ★
            #
            # 浏览器对非 GET 请求**一定**会带 Origin 头（Fetch 规范，同源也带）。
            # 而 Spring 的 WebConfig.addCorsMappings 白名单只有
            # http://localhost:* 与 http://127.0.0.1:*，我们的域名不在其中，
            # Spring 会判成「Invalid CORS request」直接回 403。
            #
            # 走反向代理时后端看到的本来就该是同源请求，摘掉即可。
            # 同一件事在 vite.config.ts 的 apiProxy 里也做过（removeHeader('origin')），
            # 那边注释解释得更详细。
            proxy_set_header Origin "";

            # 把前端的自定义头还原成后端认的 `Authorization`。
            #
            # 前端发的是 `X-Auth-Token`，不是 `Authorization` —— 因为平台边缘
            # 网关会把带 `Authorization` 的请求当成 SDK Token 截胡，后端收不到
            # （详见 frontend/src/api/request.ts 的拦截器注释）。
            # 在这里换回来，Spring 那侧一行都不用改。
            #
            # 头不存在时 $http_x_auth_token 为空串，等于移除该头，
            # 行为与原来直接透传一致。
            proxy_set_header Authorization $http_x_auth_token;

            # 上传 / 解析 PDF 可能较慢
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # ---------- AI 服务（FastAPI :8000）----------
        # 其余 /api/* 全部走这里：/api/understand、/api/generate、
        # /api/evidence-pool、/api/retrieve、/api/papers、/api/ai/* …
        location ~ ^/api/ {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin "";

            # 大模型生成慢：前端 axios 超时设的是 120s，反代不能比它短。
            # 平台侧若还有更短的网关超时，这一层再放宽也没用。
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;

            # 生成是流式返回的长连接，关掉缓冲让内容尽快到达浏览器
            proxy_buffering off;
        }
    }
}
